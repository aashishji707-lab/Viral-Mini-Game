<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>SQUISH — Squeeze. Puff. Don't die.</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#07021a;overflow:hidden;overscroll-behavior:none}
body{display:flex;align-items:center;justify-content:center;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:#fff;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#stage{position:relative;overflow:hidden;border-radius:1em;box-shadow:0 0 60px rgba(120,60,255,.35)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:1.5em;
  background:radial-gradient(ellipse at 50% 40%,rgba(30,10,80,.55),rgba(7,2,26,.88));animation:fade .35s ease both}
.hidden{display:none!important}
@keyframes fade{from{opacity:0}to{opacity:1}}
h1{font-size:4.6em;margin:.1em 0 0;letter-spacing:.04em;font-weight:900;line-height:1;
  background:linear-gradient(180deg,#eaff8a,#52d62a);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 .25em rgba(182,255,59,.55))}
h2{font-size:3em;margin:0;font-weight:900;color:#ff4d8d;filter:drop-shadow(0 0 .3em rgba(255,45,149,.6));animation:pop .4s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.tag{margin:.3em 0 1.2em;font-size:1.15em;color:#c9b8ff;font-weight:700}
.how{display:flex;flex-direction:column;gap:.5em;margin-bottom:1.4em;font-size:1em}
.how div{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:.8em;padding:.55em 1em}
.how b{color:#b6ff3b;margin-right:.4em;letter-spacing:.06em}
.how div:nth-child(2) b{color:#27e1ff}
.big{font:inherit;font-weight:900;font-size:1.7em;letter-spacing:.08em;color:#14052e;border:0;border-radius:1em;padding:.5em 1.8em;cursor:pointer;
  background:linear-gradient(180deg,#e4ff7a,#6fe02e);box-shadow:0 .25em 0 #3c9a14,0 0 1.2em rgba(182,255,59,.55);transition:transform .08s}
.big:active{transform:translateY(.2em);box-shadow:0 .05em 0 #3c9a14}
.ghost{font:inherit;font-weight:800;font-size:1em;letter-spacing:.08em;color:#fff;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.35);
  border-radius:.9em;padding:.55em 1.4em;margin-top:.8em;cursor:pointer}
.ghost:active{background:rgba(255,255,255,.22)}
.best{margin:1.1em 0 0;color:#ffd23f;font-weight:800;letter-spacing:.08em}
.hint{margin:.9em 0 0;font-size:.78em;color:#9d8cd6}
.mascot{position:relative;width:4.4em;height:2.6em;background:linear-gradient(180deg,#d9ff6b,#52d62a);border-radius:1.4em;margin-bottom:.9em;
  box-shadow:0 0 1.6em rgba(182,255,59,.6);transform-origin:50% 100%;animation:sq 1.3s ease-in-out infinite}
.mascot i{position:absolute;top:.7em;width:.8em;height:.8em;border-radius:50%;background:#fff;box-shadow:inset -.12em -.05em 0 #14052e}
.mascot i:first-child{left:1.2em}.mascot i:last-child{right:1.2em}
@keyframes sq{0%,35%{transform:scale(1,1)}50%,85%{transform:scale(.3,1.55)}100%{transform:scale(1,1)}}
.msg{font-size:1.25em;font-weight:700;color:#e8defc;margin:.5em 0 .6em;max-width:16em;min-height:2.4em}
.score{display:flex;flex-direction:column;align-items:center;line-height:1}
.score span{font-size:6em;font-weight:900;color:#fff;filter:drop-shadow(0 0 .2em rgba(39,225,255,.7))}
.score small{letter-spacing:.3em;color:#9d8cd6;font-weight:800;margin-top:.2em}
.row{display:flex;gap:1.2em;align-items:center;margin:.7em 0 .3em;font-weight:800;color:#ffd23f;letter-spacing:.06em}
.row #oRank{color:#27e1ff}
.badge{background:linear-gradient(90deg,#ff2d95,#ffd23f);color:#14052e;font-weight:900;letter-spacing:.12em;padding:.25em .9em;border-radius:2em;margin:.3em 0 .7em;animation:wig .5s ease-in-out infinite alternate}
@keyframes wig{from{transform:rotate(-3deg) scale(1)}to{transform:rotate(3deg) scale(1.08)}}
#board{display:flex;gap:.5em;margin:.9em 0 .6em;font-size:.85em;font-weight:800;color:#9d8cd6}
#board span{padding:.25em .65em;border-radius:.6em;background:rgba(255,255,255,.07)}
#board span.me{background:#b6ff3b;color:#14052e}
#mute{position:absolute;top:.6em;right:.6em;z-index:5;width:2.4em;height:2.4em;border-radius:50%;border:1.5px solid rgba(255,255,255,.3);
  background:rgba(0,0,0,.35);color:#fff;font-size:1em;cursor:pointer}
#toast{position:absolute;left:50%;bottom:4em;transform:translateX(-50%);background:#fff;color:#14052e;font-weight:800;padding:.6em 1.2em;border-radius:2em;
  z-index:9;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap;font-size:.9em}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <button id="mute" aria-label="Toggle sound">🔊</button>

  <div id="menu" class="ov">
    <div class="mascot"><i></i><i></i></div>
    <h1>SQUISH</h1>
    <p class="tag">Squeeze. Puff. Don't die.</p>
    <div class="how">
      <div><b>HOLD</b>squeeze thin &amp; steer</div>
      <div><b>RELEASE</b>puff up &amp; recharge</div>
    </div>
    <button id="play" class="big">PLAY</button>
    <p class="best" id="menuBest"></p>
    <p class="hint">Desktop: hold mouse or Space · steer with mouse or ← →</p>
  </div>

  <div id="over" class="ov hidden">
    <h2 id="oTitle">SPLAT!</h2>
    <p class="msg" id="oMsg"></p>
    <div class="score"><span id="oScore">0</span><small>SCORE</small></div>
    <div class="row"><div>BEST <b id="oBest">0</b></div><div id="oRank"></div></div>
    <div class="badge hidden" id="newBest">★ NEW BEST ★</div>
    <div id="board"></div>
    <button id="again" class="big">▶ AGAIN</button>
    <button id="share" class="ghost">SHARE SCORE CARD</button>
    <p class="hint">Space / Enter = instant retry</p>
  </div>
  <div id="toast"></div>
</div>

<script>
(()=>{
"use strict";
const W=420,H=760,JY=600;
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d'),stage=$('stage');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const r=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
let sc=1;

function resize(){
  const s=Math.min(innerWidth/W,innerHeight/H);
  stage.style.width=W*s+'px'; stage.style.height=H*s+'px'; stage.style.fontSize=16*s+'px';
  const d=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(W*s*d); cv.height=Math.round(H*s*d); sc=s*d;
}
addEventListener('resize',resize); resize();

/* ---------- storage ---------- */
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
          set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let best=ls.get('squish_best',0), top=ls.get('squish_top',[]), muted=ls.get('squish_mute',false);

/* ---------- audio ---------- */
let AC=null;
function au(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();
}
function tone(f1,f2,dur,type,vol,delay){
  if(!AC||muted)return;
  const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
  g.gain.setValueAtTime(vol||.12,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+.03);
}
function noise(d,v){
  if(!AC||muted)return;
  const n=(AC.sampleRate*d)|0,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);
  for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(),g=AC.createGain(); s.buffer=b; g.gain.value=v; s.connect(g); g.connect(AC.destination); s.start();
}
const sfx={
  squeeze(){tone(560,240,.09,'sine',.1)},
  puff(){tone(240,560,.11,'sine',.1)},
  pass(n){tone(480+Math.min(n,24)*22,700+Math.min(n,24)*30,.1,'triangle',.1)},
  near(){[880,1175,1568].forEach((f,i)=>tone(f,f*1.02,.12,'square',.07,i*.06))},
  tired(){tone(220,110,.25,'square',.07)},
  banner(){tone(260,900,.3,'sawtooth',.06)},
  die(){noise(.45,.35);tone(320,40,.55,'sawtooth',.18)},
  best(){[523,659,784,1047].forEach((f,i)=>tone(f,f,.16,'triangle',.12,i*.09))}
};
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};

/* ---------- state ---------- */
let state='menu',G=null,bgY=0,last=performance.now(),deadAt=0,overTimer=0;
let ptrDown=false,downPx=0,downJ=0,keySq=false,keyL=false,keyR=false;
const stars=Array.from({length:46},()=>({x:r(0,W),y:r(0,H),z:r(.2,1)}));

const BANNERS={10:['WIGGLY WALLS AHEAD','#ffd23f'],25:['SPEED SURGE!','#ff2d95'],40:['NOBODY SURVIVES THIS','#27e1ff']};
const FAIL={
  fat:["You forgot you're a jelly. Squeeze!","That gap was NOT built for your bones.","Too puffy. Too proud. Too dead.","The wall said no. You said 'pop'.","Plot twist: you are not thin."],
  tired:["Out of squeeze juice.","Energy 0%. Dignity 0%.","Your squeezing muscle filed a complaint.","Tired jelly = flat jelly."],
  edge:["Off by a hair. Okay, a few hairs.","So close. The wall disagrees.","Aim was a suggestion. Now it's a stain.","Pixel-perfect… for someone else.","The gap moved. Or you did. Who knows."],
  zero:["Zero. A bold artistic choice.","You speedran failing. Congrats."]
};
const RANKS=[[0,'Wet Noodle'],[8,'Jelly Rookie'],[25,'Squish Apprentice'],[50,'Gap Goblin'],[90,'Slime Ninja'],[150,'Pure Liquid']];
const rankOf=s=>{let n=RANKS[0][1];for(const [m,t] of RANKS)if(s>=m)n=t;return n};

function curSpeed(){const g=G;return 230+Math.min(170,g.t*4.5)+(g.passed>=25?40:0)+(g.passed>=40?30:0)}
function curSpacing(){return Math.max(205,300-G.t*2.4)}
const gapX=w=>w.cx+Math.sin(G.t*w.fq+w.ph)*w.amp;

function startGame(){
  au(); clearTimeout(overTimer);
  G={t:0,score:0,passed:0,spawned:0,dist:200,jx:W/2,jtx:W/2,w:80,h:38,energy:100,tired:false,sq:false,
     walls:[],parts:[],texts:[],shake:0,flash:0,flashC:'255,60,90',slow:0,pop:0,lastGx:W/2,dead:false,
     banner:null,bannerT:0,msg:'',isNew:false,topIdx:-1};
  state='play';
  $('menu').classList.add('hidden'); $('over').classList.add('hidden');
}

function spawnWall(spacing,speed){
  const g=G,n=g.spawned++,lvl=g.passed;
  const narrow=n===0?true:n===1?false:Math.random()<Math.min(.8,.4+lvl*.012);
  const gap=narrow?(n===0?58:Math.max(38,52-lvl*.3)+r(-2,3)):r(124,140);
  const swing=lvl>=12&&n>1&&Math.random()<Math.min(.55,.25+(lvl-12)*.01);
  const amp=swing?(narrow?24:38):0;
  const reach=Math.max(120,(spacing/speed)*650);
  const lo=gap/2+amp+12,hi=W-gap/2-amp-12;
  let cx=n===0?W/2:g.lastGx+r(-reach,reach);
  cx=clamp(cx,lo,hi); g.lastGx=cx;
  g.walls.push({y:-30,h:24,g:gap,cx,amp,fq:r(2,3.2),ph:r(0,6.28),narrow,passed:false,minC:99});
}

/* ---------- fx ---------- */
function burst(x,y,n,col,spd,life,size){
  for(let i=0;i<n;i++){const a=r(0,6.283),s=r(.2,1)*spd;
    G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:r(.5,1)*life,max:life,size:r(.6,1)*size,col,g:380});}
}
function text(x,y,t,col,size){G.texts.push({x,y,t,col,size:size||22,life:.9,max:.9})}
function updateFX(dt){
  const g=G;
  for(const p of g.parts){p.life-=dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}
  g.parts=g.parts.filter(p=>p.life>0);
  for(const t of g.texts){t.life-=dt;t.y-=46*dt}
  g.texts=g.texts.filter(t=>t.life>0);
  g.shake=Math.max(0,g.shake-dt*45); g.flash=Math.max(0,g.flash-dt*3);
  if(g.bannerT>0)g.bannerT-=dt;
}

/* ---------- gameplay ---------- */
function update(raw){
  const g=G;
  g.pop=Math.max(0,g.pop-raw*4);
  if(g.slow>0)g.slow-=raw;
  const dt=raw*(g.slow>0?.35:1);
  g.t+=dt;
  const speed=curSpeed(),spacing=curSpacing();

  const want=ptrDown||keySq;
  if(g.energy<=0&&!g.tired){g.tired=true;sfx.tired();text(g.jx,JY-60,'TIRED!','#ff9d3f',24)}
  if(g.tired&&g.energy>=30)g.tired=false;
  const sq=want&&!g.tired;
  if(sq!==g.sq){g.sq=sq;sq?sfx.squeeze():sfx.puff();burst(g.jx,JY,8,sq?'#d9ff6b':'#27e1ff',140,.35,3)}
  g.energy=clamp(g.energy+(sq?-38:28)*dt,0,100);

  if(keyL)g.jtx-=520*dt; if(keyR)g.jtx+=520*dt;
  g.jtx=clamp(g.jtx,16,W-16);
  const cap=sq?1300:420,d=g.jtx-g.jx,step=clamp(d,-cap*dt,cap*dt);
  g.jx+=step;
  const k=Math.min(1,dt*30);
  g.w+=((sq?24:80)-g.w)*k; g.h+=((sq?58:38)-g.h)*k;
  g.jx=clamp(g.jx,g.w/2,W-g.w/2);
  if(sq&&Math.abs(step)>3&&Math.random()<.6)g.parts.push({x:g.jx,y:JY+r(-10,10),vx:r(-20,20),vy:r(-20,20),life:.35,max:.35,size:3,col:'#b6ff3b',g:0});

  g.dist+=speed*dt;
  if(g.dist>=spacing){g.dist=0;spawnWall(spacing,speed)}
  bgY+=speed*dt*.5;

  for(const w of g.walls){
    w.y+=speed*dt;
    const gx=gapX(w),gl=gx-w.g/2,gr=gx+w.g/2;
    const top=JY-g.h/2,bot=JY+g.h/2;
    if(w.y+w.h>top+3&&w.y<bot-3){
      const clear=Math.min(g.jx-g.w/2-gl,gr-(g.jx+g.w/2));
      w.minC=Math.min(w.minC,clear);
      if(clear<-1.5){die(w);break}
    }
    if(!w.passed&&w.y+w.h/2>JY){w.passed=true;onPass(w)}
  }
  g.walls=g.walls.filter(w=>w.y<H+50);
  updateFX(raw);
}

function onPass(w){
  const g=G;
  g.passed++;
  let pts=w.narrow?3:1;
  const near=w.minC>=-1.5&&w.minC<5;
  if(near){
    pts+=5; g.slow=.22; g.shake=7; g.flash=.5; g.flashC='255,230,90';
    text(g.jx,JY-70,w.narrow?'CLOSE!':'TIGHT!','#ffd23f',30);
    burst(g.jx,JY,22,'#ffd23f',260,.6,3.5); sfx.near(); buzz(25);
  }else{
    sfx.pass(g.passed);
    burst(g.jx,JY-20,6,w.narrow?'#ff2d95':'#27e1ff',120,.35,2.5);
  }
  g.score+=pts; g.pop=1;
  text(g.jx+(g.w/2)+14,JY-30,'+'+pts,'#fff',18);
  const b=BANNERS[g.passed];
  if(b){g.banner=b;g.bannerT=1.8;sfx.banner()}
}

function die(w){
  const g=G;
  g.dead=true; state='over'; deadAt=performance.now();
  const cause=g.tired?'tired':(w.narrow&&g.w>45?'fat':'edge');
  g.msg=g.score===0&&Math.random()<.6?pick(FAIL.zero):pick(FAIL[cause]);
  g.shake=20; g.flash=1; g.flashC='255,60,90';
  burst(g.jx,JY,70,'#b6ff3b',420,.9,5); burst(g.jx,JY,25,'#ffffff',300,.5,3);
  sfx.die(); buzz([60,40,60]);
  g.isNew=g.score>best&&g.score>0;
  if(g.isNew){best=g.score;ls.set('squish_best',best)}
  if(g.score>0){top.push(g.score);top.sort((a,b)=>b-a);top=top.slice(0,5);ls.set('squish_top',top);g.topIdx=top.indexOf(g.score)}
  overTimer=setTimeout(showOver,380);
}

function showOver(){
  const g=G; if(state!=='over')return;
  $('oTitle').textContent=pick(['SPLAT!','SQUISHED!','POP!','OOF.','FLATTENED!']);
  $('oMsg').textContent=g.msg;
  $('oScore').textContent=g.score;
  $('oBest').textContent=best;
  $('oRank').textContent=rankOf(g.score).toUpperCase();
  $('newBest').classList.toggle('hidden',!g.isNew);
  $('board').innerHTML=top.map((s,i)=>`<span class="${i===g.topIdx?'me':''}">${i+1}. ${s}</span>`).join('');
  $('over').classList.remove('hidden');
  if(g.isNew)sfx.best();
}

/* ---------- drawing ---------- */
function rr(x,y,w,h,rad){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,Math.max(0,rad));else ctx.rect(x,y,w,h);ctx.fill()}

function drawBG(){
  const gr=ctx.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,'#1a0b4b');gr.addColorStop(.6,'#2a0f5e');gr.addColorStop(1,'#07021a');
  ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(130,90,255,.16)';ctx.lineWidth=1;ctx.beginPath();
  for(let y=(bgY%60)-60;y<H;y+=60){ctx.moveTo(0,y);ctx.lineTo(W,y)}
  for(let x=0;x<=W;x+=52){ctx.moveTo(x,0);ctx.lineTo(x,H)}
  ctx.stroke();
  ctx.fillStyle='#fff';
  for(const s of stars){
    const y=(s.y+bgY*s.z*.6)%H;
    ctx.globalAlpha=.25+s.z*.5;ctx.fillRect(s.x,y,s.z*2,s.z*2+1);
  }
  ctx.globalAlpha=1;
}

function drawWalls(g){
  for(const w of g.walls){
    const gx=gapX(w),gl=gx-w.g/2,gr=gx+w.g/2;
    const c=w.narrow?'#ff2d95':'#27e1ff',c2=w.narrow?'#9b0f57':'#0e7f9e';
    const gd=ctx.createLinearGradient(0,w.y,0,w.y+w.h);gd.addColorStop(0,c);gd.addColorStop(1,c2);
    ctx.shadowColor=c;ctx.shadowBlur=16;ctx.fillStyle=gd;
    rr(-12,w.y,gl+12,w.h,8);rr(gr,w.y,W-gr+12,w.h,8);
    ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,255,255,.85)';
    ctx.fillRect(gl-3,w.y+3,3,w.h-6);ctx.fillRect(gr,w.y+3,3,w.h-6);
    ctx.fillStyle='rgba(255,255,255,.22)';
    ctx.fillRect(0,w.y+2,gl-4,3);ctx.fillRect(gr+3,w.y+2,W-gr,3);
  }
}

function drawJelly(g){
  const wob=Math.sin(g.t*9)*1.2;
  const w=g.w+(g.sq?0:wob*1.5),h=g.h-(g.sq?0:wob),x=g.jx,y=JY;
  ctx.save();
  ctx.shadowColor='#b6ff3b';ctx.shadowBlur=g.tired?4:22;
  const gd=ctx.createLinearGradient(0,y-h/2,0,y+h/2);
  gd.addColorStop(0,g.tired?'#a5c94a':'#d9ff6b');gd.addColorStop(1,g.tired?'#5f8a1d':'#52d62a');
  ctx.fillStyle=gd;rr(x-w/2,y-h/2,w,h,Math.min(w,h)/2);
  ctx.shadowBlur=0;
  ctx.fillStyle='rgba(255,255,255,.35)';rr(x-w/2+w*.14,y-h/2+h*.08,w*.5,h*.13,h*.06);
  const nw=g.walls.find(q=>!q.passed);
  const danger=nw&&JY-(nw.y+nw.h)<170&&JY-(nw.y+nw.h)>-20;
  const look=nw?clamp((gapX(nw)-x)/60,-1,1):0;
  const ey=y-h*.1,sp=Math.max(5.5,w*.2),er=(g.sq?4.2:7)*(danger?1.2:1);
  for(const s of[-1,1]){
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x+s*sp,ey,er,0,6.283);ctx.fill();
    ctx.fillStyle='#14052e';ctx.beginPath();ctx.arc(x+s*sp+look*er*.35,ey+(danger?-er*.1:er*.1),er*(danger?.38:.52),0,6.283);ctx.fill();
    if(g.tired){ctx.fillStyle=gd;ctx.fillRect(x+s*sp-er-1,ey-er-1,er*2+2,er+1)}
  }
  ctx.strokeStyle='#14052e';ctx.fillStyle='#14052e';ctx.lineWidth=2;ctx.lineCap='round';
  const my=y+h*.2;
  if(g.tired){ctx.beginPath();ctx.moveTo(x-5,my+2);ctx.quadraticCurveTo(x,my-3,x+5,my+2);ctx.stroke()}
  else if(g.sq||danger){ctx.beginPath();ctx.ellipse(x,my,3,danger?4.5:3,0,0,6.283);ctx.fill()}
  else{ctx.beginPath();ctx.arc(x,my-3,Math.min(10,w*.14),.15*Math.PI,.85*Math.PI);ctx.stroke()}
  ctx.restore();
}

function drawHUD(g){
  ctx.textAlign='center';ctx.textBaseline='alphabetic';
  const size=56+g.pop*16;
  ctx.font=`900 ${size}px "Trebuchet MS",system-ui,sans-serif`;
  ctx.fillStyle='#fff';ctx.shadowColor='#27e1ff';ctx.shadowBlur=18;
  ctx.fillText(g.score,W/2,82);ctx.shadowBlur=0;
  ctx.textAlign='left';ctx.font='800 14px "Trebuchet MS",system-ui,sans-serif';ctx.fillStyle='#ffd23f';
  ctx.fillText('BEST '+Math.max(best,g.score),14,28);
  const bw=200,bx=(W-bw)/2,by=H-36;
  ctx.fillStyle='rgba(255,255,255,.12)';rr(bx,by,bw,12,6);
  const p=g.energy/100,low=p<.3||g.tired;
  ctx.fillStyle=g.tired?((g.t*8|0)%2?'#ff4d4d':'#ff9d3f'):low?'#ff9d3f':'#b6ff3b';
  if(p>0)rr(bx,by,bw*p,12,6);
  ctx.textAlign='center';ctx.font='800 11px "Trebuchet MS",system-ui,sans-serif';ctx.fillStyle='rgba(255,255,255,.65)';
  ctx.fillText(g.tired?'TIRED — PUFF TO RECHARGE':'SQUEEZE ENERGY',W/2,by+28);
  if(!g.dead&&g.passed<2&&g.t<12){
    ctx.globalAlpha=.65+.35*Math.sin(g.t*6);
    ctx.font='900 18px "Trebuchet MS",system-ui,sans-serif';ctx.fillStyle='#fff';
    ctx.fillText(g.passed===0?'HOLD to squeeze · SLIDE to steer':'RELEASE to puff up & recharge',W/2,H-66);
    ctx.globalAlpha=1;
  }
  if(g.bannerT>0){
    const a=Math.min(1,g.bannerT*2),sz=26+(1-Math.min(1,(1.8-g.bannerT)*6))*14;
    ctx.globalAlpha=a;ctx.font=`900 ${sz}px "Trebuchet MS",system-ui,sans-serif`;
    ctx.fillStyle=g.banner[1];ctx.shadowColor=g.banner[1];ctx.shadowBlur=20;
    ctx.fillText(g.banner[0],W/2,170);ctx.shadowBlur=0;ctx.globalAlpha=1;
  }
}

function draw(){
  ctx.setTransform(sc,0,0,sc,0,0);
  drawBG();
  if(G&&state!=='menu'){
    const g=G;
    ctx.save();
    if(g.shake>0)ctx.translate(r(-1,1)*g.shake,r(-1,1)*g.shake);
    drawWalls(g);
    if(!g.dead)drawJelly(g);
    for(const p of g.parts){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,6.283);ctx.fill()}
    ctx.globalAlpha=1;
    ctx.textAlign='center';
    for(const t of g.texts){ctx.globalAlpha=clamp(t.life/t.max*1.5,0,1);ctx.font=`900 ${t.size}px "Trebuchet MS",system-ui,sans-serif`;
      ctx.fillStyle=t.col;ctx.shadowColor=t.col;ctx.shadowBlur=10;ctx.fillText(t.t,t.x,t.y)}
    ctx.shadowBlur=0;ctx.globalAlpha=1;
    ctx.restore();
    if(g.flash>0){ctx.fillStyle=`rgba(${g.flashC},${g.flash*.4})`;ctx.fillRect(0,0,W,H)}
    drawHUD(g);
  }
  const vg=ctx.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.75);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.45)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}

function frame(now){
  const raw=Math.min(.05,(now-last)/1000);last=now;
  if(state==='play')update(raw);
  else if(state==='over')updateFX(raw);
  else bgY+=raw*110;
  draw();
  requestAnimationFrame(frame);
}

/* ---------- input ---------- */
const px=e=>{const b=cv.getBoundingClientRect();return (e.clientX-b.left)/b.width*W};
addEventListener('pointerdown',e=>{
  if(e.target.closest&&e.target.closest('button'))return;
  au();
  if(state!=='play')return;
  ptrDown=true;downPx=px(e);downJ=G.jtx;
  try{e.target.setPointerCapture(e.pointerId)}catch(_){}
  e.preventDefault();
},{passive:false});
addEventListener('pointermove',e=>{
  if(ptrDown&&state==='play'){G.jtx=clamp(downJ+(px(e)-downPx)*1.15,16,W-16)}
});
const up=()=>{ptrDown=false};
addEventListener('pointerup',up);addEventListener('pointercancel',up);addEventListener('blur',()=>{up();keySq=keyL=keyR=false});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{last=performance.now();up()});

addEventListener('keydown',e=>{
  const k=e.key;
  if(k===' '||k==='Enter'){
    e.preventDefault();au();
    if(state==='menu'||(state==='over'&&performance.now()-deadAt>300)){startGame()}
    if(k===' ')keySq=true;
    return;
  }
  if(k==='ArrowUp'||k==='ArrowDown'||k==='Shift'||k==='w'||k==='W'||k==='s'||k==='S'){keySq=true;e.preventDefault()}
  if(k==='ArrowLeft'||k==='a'||k==='A'){keyL=true;e.preventDefault()}
  if(k==='ArrowRight'||k==='d'||k==='D'){keyR=true;e.preventDefault()}
});
addEventListener('keyup',e=>{
  const k=e.key;
  if(k===' '||k==='ArrowUp'||k==='ArrowDown'||k==='Shift'||'wWsS'.includes(k)&&k.length===1)keySq=false;
  if(k==='ArrowLeft'||k==='a'||k==='A')keyL=false;
  if(k==='ArrowRight'||k==='d'||k==='D')keyR=false;
});

/* ---------- UI ---------- */
function setMuteIcon(){$('mute').textContent=muted?'🔇':'🔊'}
$('mute').addEventListener('click',e=>{muted=!muted;ls.set('squish_mute',muted);setMuteIcon();au();e.currentTarget.blur()});
setMuteIcon();
$('play').addEventListener('click',e=>{e.currentTarget.blur();if(state!=='play')startGame()});
$('again').addEventListener('click',e=>{e.currentTarget.blur();if(state!=='play')startGame()});
$('share').addEventListener('click',e=>{e.currentTarget.blur();share()});
$('menuBest').textContent=best?'PERSONAL BEST: '+best:'';

let toastT=0;
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),2200)}

function wrapText(x,t,str,cx,cy,maxW,lh){
  const words=str.split(' ');let line='';
  for(const w of words){const test=line?line+' '+w:w;if(x.measureText(test).width>maxW&&line){x.fillText(line,cx,cy);line=w;cy+=lh}else line=test}
  x.fillText(line,cx,cy);
}

async function share(){
  const g=G;if(!g)return;
  const c=document.createElement('canvas');c.width=1080;c.height=1350;const x=c.getContext('2d');
  const bg=x.createLinearGradient(0,0,0,1350);bg.addColorStop(0,'#1a0b4b');bg.addColorStop(1,'#07021a');
  x.fillStyle=bg;x.fillRect(0,0,1080,1350);
  x.strokeStyle='rgba(130,90,255,.2)';x.lineWidth=2;x.beginPath();
  for(let i=0;i<1350;i+=90){x.moveTo(0,i);x.lineTo(1080,i)}for(let i=0;i<1080;i+=90){x.moveTo(i,0);x.lineTo(i,1350)}x.stroke();
  x.textAlign='center';
  x.font='900 150px "Trebuchet MS",system-ui,sans-serif';
  const tg=x.createLinearGradient(0,100,0,250);tg.addColorStop(0,'#eaff8a');tg.addColorStop(1,'#52d62a');
  x.fillStyle=tg;x.shadowColor='#b6ff3b';x.shadowBlur=40;x.fillText('SQUISH',540,230);x.shadowBlur=0;
  // jelly
  const jg=x.createLinearGradient(0,330,0,450);jg.addColorStop(0,'#d9ff6b');jg.addColorStop(1,'#52d62a');
  x.fillStyle=jg;x.shadowColor='#b6ff3b';x.shadowBlur=50;x.beginPath();x.roundRect(430,330,220,130,65);x.fill();x.shadowBlur=0;
  for(const s of[-1,1]){x.fillStyle='#fff';x.beginPath();x.arc(540+s*40,385,24,0,6.283);x.fill();x.fillStyle='#14052e';x.beginPath();x.arc(540+s*40,392,12,0,6.283);x.fill()}
  x.strokeStyle='#14052e';x.lineWidth=7;x.lineCap='round';x.beginPath();x.arc(540,420,24,.15*Math.PI,.85*Math.PI);x.stroke();
  x.fillStyle='#9d8cd6';x.font='800 44px "Trebuchet MS",system-ui,sans-serif';x.fillText('MY SCORE',540,590);
  x.fillStyle='#fff';x.shadowColor='#27e1ff';x.shadowBlur=50;x.font='900 340px "Trebuchet MS",system-ui,sans-serif';x.fillText(String(g.score),540,880);x.shadowBlur=0;
  x.fillStyle='#27e1ff';x.font='900 58px "Trebuchet MS",system-ui,sans-serif';x.fillText(rankOf(g.score).toUpperCase(),540,985);
  x.fillStyle='#e8defc';x.font='700 46px "Trebuchet MS",system-ui,sans-serif';wrapText(x,0,'“'+g.msg+'”',540,1070,860,60);
  x.fillStyle='#ffd23f';x.font='800 44px "Trebuchet MS",system-ui,sans-serif';x.fillText('BEST '+best,540,1190);
  x.fillStyle='#ff4d8d';x.font='900 64px "Trebuchet MS",system-ui,sans-serif';x.fillText('CAN YOU BEAT ME?',540,1290);
  const blob=await new Promise(res=>c.toBlob(res,'image/png'));
  const txt=`I scored ${g.score} in SQUISH 🟢 "${g.msg}" Can you beat me?`;
  try{
    const file=new File([blob],'squish-score.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],text:txt,title:'SQUISH'});toast('Shared!');return}
  }catch(err){if(err&&err.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='squish-score.png';document.body.appendChild(a);a.click();a.remove();
  try{await navigator.clipboard.writeText(txt)}catch(_){}
  toast('Score card saved + text copied!');
}

requestAnimationFrame(frame);
})();
